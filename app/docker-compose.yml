# docker-compose.yml
version: '3.8'

services:
  chat-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4441:4441"
    environment:
      NODE_ENV: production
      PORT: 4441
    # nur Logs persistent halten
    volumes:
      - chat-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4441/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  chat-logs:
    driver: local
