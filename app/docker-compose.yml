# Docker Compose für Chat-System
# ==============================
version: '3.8'

services:
  chat-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4441:4441"
    environment:
      - NODE_ENV=production
      - PORT=4441
    volumes:
      # Für Development: Live-Reload
      # - ./app/backend:/app/backend
      # - ./app/frontend:/app/frontend
      
      # Für Production: nur Logs persistent
      - chat-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4441/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  chat-logs:
    driver: local
