version: '3.8'

services:
  chat-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8444:8444"
    # Umgebungsvariablen aus .env laden
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      # Nur Logs persistent halten
      - chat-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8444/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  chat-logs:
    driver: local
