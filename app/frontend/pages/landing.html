<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat-Portal</title>

  <!-- Skript -->
  <script type="module" src="/src/landing.js"></script>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Ausgelagertes CSS -->
  <link rel="stylesheet" href="/styles/landing.css">
</head>
<body>
  <main class="card">
    <h1>🔑 Chat-Portal</h1>
    <p>Gib den 64-stelligen Raum-Token ein<br>und trete deinem Chat-Raum bei.</p>

    <form id="enter-form" autocomplete="off">
      <label for="token-input">Raum-Token</label>
      <input id="token-input" type="text" placeholder="SHA-256-Hash …"
             pattern="[a-fA-F0-9]{64}" minlength="64" maxlength="64"
             title="64 hexadezimale Zeichen (SHA-256-Hash)" required autofocus>
      <button type="submit">Betreten 🚀</button>
    </form>

    <footer>&copy; 2025 Unser Chat-Projekt</footer>
  </main>
</body>
</html>
