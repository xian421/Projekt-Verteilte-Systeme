<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Admin Panel – Realtime Chat</title>
  <link rel="icon" href="/img/admin-icon.png" type="image/png">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <!-- Web-Component & Seiten-Script -->
  <script type="module" src="/components/AdminPanel.js"></script>
  <script type="module" src="/src/admin-login.js"></script>

  <!-- Ausgelagertes CSS -->
  <link rel="stylesheet" href="/styles/admin.css">
</head>
<body>

  <!-- 1) Login-Maske -->
  <div id="auth-screen">
    <h2>🔐 Admin-Login</h2>
    <input type="password" id="auth-password" placeholder="Passwort eingeben">
    <button id="auth-submit">Einloggen</button>
    <p id="auth-error" hidden>❌ Falsches Passwort</p>
  </div>

  <!-- 2) Template für das Panel -->
  <template id="panel-tpl">
    <chat-admin></chat-admin>
  </template>
</body>
</html>
