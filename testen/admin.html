<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel – Realtime Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #f8fafc;
      --card: #fff;
      --text: #0f172a;
      --accent: #2563eb;
      --accent-bg: #eef2ff;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 1.2rem;
      --shadow: 0 2px 12px 0 rgba(16, 30, 54, 0.08);
      --mono: ui-monospace, SFMono-Regular, "Menlo", monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101324;
        --card: #18192e;
        --text: #f1f5f9;
        --accent-bg: #29346a;
        --danger-bg: #6d2323;
        --muted: #94a3b8;
        --border: #232347;
        --shadow: 0 2px 16px 0 rgba(36, 54, 98, 0.17);
      }
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      padding: 2.2rem 0.7rem 3.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      min-height: 100vh;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -1px;
      text-align: center;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }
    main {
      display: grid;
      gap: 2.2rem;
      grid-template-columns: 1fr 1fr;
      max-width: 950px;
      margin: 0 auto;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }

    section {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem 1.5rem 1.6rem 1.5rem;
      border: 1px solid var(--border);
      min-width: 0;
    }
    h2 {
      font-size: 1.28rem;
      margin-bottom: 1.2rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    /* List Styles */
    ul { list-style: none; display: flex; flex-direction: column; gap: 1rem; padding: 0; }
    li {
      background: var(--accent-bg);
      border-radius: 0.9rem;
      padding: 1.1rem 1rem 0.95rem 1rem;
      border: 1.5px solid var(--border);
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 1rem;
      position: relative;
      transition: box-shadow 0.12s, border-color 0.12s;
      box-shadow: none;
    }
    li:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 8px 0 rgba(38, 99, 235, 0.10);
    }

    /* Raumtitel/Name */
    .room-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.25em;
    }
    .room-title {
      font-weight: 600;
      font-size: 1.07rem;
      margin-bottom: 0.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .room-link {
      background: var(--accent-bg);
      color: var(--accent);
      border-radius: 0.45em;
      font-size: 0.98em;
      font-weight: 500;
      padding: 0.13em 0.55em;
      text-decoration: none;
      transition: background .13s;
      display: inline-block;
      margin-bottom: 0.05em;
    }
    .room-link:hover { background: var(--accent); color: #fff; }
    .hash {
      font-family: var(--mono);
      color: var(--muted);
      font-size: 0.94em;
      background: transparent;
      margin-top: 0.07em;
      word-break: break-all;
    }

    /* Buttons */
    button, .icon-btn {
      border: none;
      outline: none;
      border-radius: 0.6em;
      padding: 0.37em 0.9em;
      font-size: 1.05rem;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background .13s, color .13s, box-shadow .13s;
      box-shadow: 0 2px 8px rgba(37,99,235,0.08);
      margin-left: 0.2em;
    }
    button:focus, .icon-btn:focus { outline: 2px solid var(--accent); }
    button.copy, .icon-btn.copy {
      background: transparent;
      color: var(--accent);
      font-size: 1.18em;
      padding: 0.2em 0.42em;
      box-shadow: none;
      margin-right: 0.15em;
      margin-left: 0;
    }
    button.copy:hover, .icon-btn.copy:hover {
      color: #fff;
      background: var(--accent);
    }
    button.remove {
      background: var(--danger);
      color: #fff;
      margin-left: 0.6em;
      font-size: 1.12em;
      padding: 0.23em 0.73em;
    }
    button.remove:hover {
      background: var(--danger-bg);
      color: var(--danger);
    }

    /* Input Row */
    .inputRow {
      display: flex;
      gap: 0.7em;
      margin-top: 1.3rem;
    }
    input {
      font-size: 1rem;
      border-radius: 0.5em;
      padding: 0.6em 1em;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text);
      min-width: 0;
      flex: 1 1 auto;
      transition: border .13s, box-shadow .13s;
      box-shadow: 0 1px 4px rgba(16, 30, 54, 0.07);
    }
    input:focus { border-color: var(--accent); }

    /* IPs */
    .ip-entry {
      font-family: var(--mono);
      color: var(--text);
      font-size: 1.02em;
    }
    .copied {
      color: var(--accent);
      background: #e0e7ff;
      border-radius: 0.5em;
      padding: 0.12em 0.5em;
      margin-left: 0.2em;
      font-size: 0.96em;
      animation: fadeout 1.2s linear;
    }
    @keyframes fadeout {
      0% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Mobile tweaks */
    @media (max-width: 600px) {
      section { padding: 1.2rem 0.7rem; }
      main { padding: 0; }
      .inputRow { flex-direction: column; gap: 0.7em; }
    }

  #auth-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
  padding-top: 5rem;
  max-width: 320px;
  margin: auto;
}
#auth-screen input {
  padding: 0.6em 1em;
  font-size: 1rem;
  border-radius: 0.5em;
  border: 1.5px solid var(--border);
  background: var(--card);
  color: var(--text);
  width: 100%;
}
#auth-screen button {
  padding: 0.5em 1.2em;
  font-size: 1rem;
  border-radius: 0.5em;
  background: var(--accent);
  color: white;
  border: none;
  cursor: pointer;
}

  </style>

  <script type="module" src="admin.js" defer></script>
</head>
<body>
   <div id="navbar-container"></div>
   <div id="auth-screen">
  <h2>🔐 Admin-Zugang</h2>
  <input type="password" id="auth-password" placeholder="Passwort eingeben" />
  <button id="auth-submit">Einloggen</button>
  <p id="auth-error" style="color: var(--danger); display: none;">❌ Falsches Passwort</p>
</div>

 <div id="admin-panel" style="display: none;">
  <h1>🛠️ Admin Panel</h1>
  <main>
    <!-- Blocklist -->
    <section>
      <h2>Blockierte&nbsp;IPs für Raum <span id="room-name-display"></span></h2>
      <ul id="blocklist"></ul>
      <div class="inputRow">
        <input id="block-ip" type="text" placeholder="Neue IP sperren" />
        <button id="add-ip">Hinzufügen</button>
      </div>
    </section>
    <!-- Räume -->
    <section>
      <h2>Räume</h2>
      <ul id="rooms-list"></ul>
      <div class="inputRow">
        <input id="room-name" type="text" placeholder="Raumname …" />
        <button id="add-room">Anlegen</button>
      </div>
    </section>
  </main>
  </div>
</body>
</html>
