name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      # 1) Code auschecken
      - uses: actions/checkout@v3

      # 2) Node.js installieren
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3) Cache für node_modules
      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: app/backend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('app/backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 4) Abhängigkeiten installieren
      - name: Install Dependencies
        working-directory: app/backend
        run: npm ci

      # 5) Server im Hintergrund starten
      - name: Start Server
        working-directory: app/backend
        run: |
          npm start &
          sleep 5

      # 6) Tests ausführen
      - name: Run Tests
        working-directory: app/backend
        run: npm test
