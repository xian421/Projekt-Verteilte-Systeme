name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: keule
      PORT: 8444
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Cache Backend Modules
        uses: actions/cache@v3
        with:
          path: app/backend/node_modules
          key: ${{ runner.os }}-node-backend-${{ hashFiles('app/backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-backend-

      - name: Install Backend Dependencies
        working-directory: app/backend
        run: npm install

      - name: Start Backend Server (für Integrationstests)
        working-directory: app/backend
        run: |
          npm start &
          sleep 5

      - name: Run Backend Tests
        working-directory: app/backend
        run: npm test

  test-frontend:
    needs: test-backend   # optional: warte, bis Backend-Tests durch sind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Cache Frontend Modules
        uses: actions/cache@v3
        with:
          path: app/frontend/node_modules
          key: ${{ runner.os }}-node-frontend-${{ hashFiles('app/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-frontend-

      - name: Install Frontend Dependencies
        working-directory: app/frontend
        run: npm install

      - name: Run Frontend Tests
        working-directory: app/frontend
        run: npm test
