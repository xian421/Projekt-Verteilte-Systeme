# .github/workflows/backend-ci.yml
name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    env:
      # Setze hier defaults, die config.js erwartet
      ADMIN_PASSWORD: keule
      PORT: 4441
      NODE_ENV: test       # sorgt dafür, dass unser Throw in config.js übersprungen wird

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: app/backend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('app/backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        working-directory: app/backend
        run: npm install

      - name: Start Server
        working-directory: app/backend
        # Für den API-Integrationstest: Starte im Hintergrund
        run: |
          npm start &
          sleep 5

      - name: Run Tests
        working-directory: app/backend
        run: npm test
