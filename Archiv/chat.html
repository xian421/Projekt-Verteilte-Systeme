<!-- chat.html -->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Ein leichter Web-Component-Chat mit Container-Queries & Auto-Dark-Mode" />

  <link rel="icon" href="http://141.72.13.151:4441/img/chat-icon.png" type="image/png" />
  <title>Chat</title>

  <style>
    /* -------- Reset -------- */
    *,*::before,*::after{box-sizing:border-box}
    html,body{overflow-x:hidden}

    /* -------- Gradients -------- */
    :root{
      --bg-light: linear-gradient(135deg,#dbeafe,#fff);
      --bg-dark:  linear-gradient(135deg,#0f172a,#1f2937);
    }

    /* ----- Grundlayout (hell) ----- */
    html,body{
      height:100%;
      margin:0;
      background:var(--bg-light);               /* helles Default */
      font-family:system-ui,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100dvh;
      color-scheme: light dark;                 /* für native Form-Elemente */
    }

    /* ----- OS-Dark → ganzen Viewport abdunkeln ----- */
    @media (prefers-color-scheme: dark){
      html,body{                                 /* 🔧 html+body statt nur body */
        background:var(--bg-dark);
      }
    }

    /* ----- Manueller Dark-Switch (theme="dark") ----- */
    html:has(chat-app[theme="dark"]),
    body:has(chat-app[theme="dark"]){             /* 🔧 beide Elemente */
      background:var(--bg-dark);
    }

    /* -------- Mobile Layout -------- */
    @media (max-width:30rem){
      body{
        align-items:stretch;
        justify-content:flex-start;
        padding:0;
      }
      chat-app{width:100vw;}
    }

    /* -------- Utilities -------- */
    ::selection{background:hsl(220 90% 56% / .25)}
    @media (prefers-reduced-motion:reduce){
      *{animation:none!important;transition:none!important}
    }
  </style>

  <!-- deine Web-Component -->
  <script type="module" src="/chat-app.js"></script>
</head>

<body>
  <noscript>
    <p style="margin:2rem;font:1rem/1.4 system-ui,sans-serif;text-align:center">
      ⚠️ Dieser Chat benötigt JavaScript. Bitte JS aktivieren.
    </p>
  </noscript>

  <!-- kein theme-Attribut → Auto-Light/Dark -->
  <chat-app room-hash="__ROOM_HASH__" room-name="__ROOM_NAME__"></chat-app>

  <script>
    /* Fokus-Hilfe für den Namen->Chat-Input-Jump */
    document.addEventListener('DOMContentLoaded', () => {
      const nameInput = document.getElementById('name-input');
      const startBtn  = document.getElementById('start-btn');
      const chatInput = document.getElementById('chat-input');
      if (nameInput && startBtn && chatInput) {
        startBtn.addEventListener('click', () => chatInput.focus());
      }
    });
  </script>
</body>
</html>
