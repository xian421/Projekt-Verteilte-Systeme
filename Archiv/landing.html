<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat‑Portal</title>

  <!-- Google‑Font für modernen Look -->
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* -------------- Design‑Variablen -------------- */
    :root {
      --accent: #00bcd4;
      --bg-start: #0f2027;
      --bg-mid:   #203a43;
      --bg-end:   #2c5364;
      --card-bg:  rgba(255,255,255,0.12);
      --border:   rgba(255,255,255,0.2);
      --text:     #f8f8f8;
    }

    /* -------------- Basis‑Styles -------------- */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
      color: var(--text);
      padding: 1rem;
    }

    /* -------------- Karte -------------- */
    .card {
      backdrop-filter: blur(8px) saturate(120%);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2.5rem clamp(2rem,5vw,4rem);
      width: 100%;
      max-width: 28rem;
      box-shadow: 0 1rem 2rem rgba(0,0,0,0.35);
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem,6vw,2.75rem);
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    p {
      opacity: 0.9;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    /* -------------- Formular -------------- */
    label {
      display: block;
      text-align: left;
      font-size: 0.875rem;
      margin-bottom: 0.25rem;
      opacity: 0.8;
    }

    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid transparent;
      border-radius: 0.75rem;
      font-size: 1rem;
      transition: all 0.3s;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,188,212,0.35);
    }

    button {
      margin-top: 1.25rem;
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 0.75rem;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0.5rem 1rem rgba(0,188,212,0.45);
    }

    button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🔑 Chat‑Portal</h1>
    <p>Gib den 64‑stelligen Raum‑Token ein<br>und trete deinem Chat‑Raum bei.</p>

    <form id="enter-form" autocomplete="off">
      <label for="token-input">Raum‑Token</label>
      <input id="token-input" type="text" placeholder="SHA‑256‑Hash …"
             pattern="[a-fA-F0-9]{64}" minlength="64" maxlength="64"
             title="64 hexadezimale Zeichen (SHA‑256‑Hash)" required autofocus>
      <button type="submit">Betreten 🚀</button>
    </form>

    <footer>
      <span>&copy; 2025 Dein Chat‑Projekt</span>
    </footer>
  </main>

  <script>
    // Wenn Formular abgeschickt wird → auf /chat.html/<hash> weiterleiten
    document.getElementById('enter-form').addEventListener('submit', e => {
      e.preventDefault();
      const hash = document.getElementById('token-input').value.trim();
      if (!/^[a-fA-F0-9]{64}$/.test(hash)) return; // Client‑Side‑Validation
      window.location.href = '/chat.html/' + hash.toLowerCase();
    });
  </script>
</body>
</html>
